[package]
name = "lab16-projet-solution"
version = "1.0.0"
edition = "2024"
description = "Labo 16 du cours Rust, solution : sondes, un service qui sonde des cibles TCP et expose leur état"
publish = false

# La bibliothèque porte le même nom dans le squelette et dans la solution :
# tests/sondes.rs écrit `use sondes::...` et reste identique dans les deux.
[lib]
name = "sondes"
path = "src/lib.rs"

# Nom distinct de celui du squelette : les deux binaires partagent le même
# dossier target/ de l'espace de travail. Dans ton projet, ce serait "sondes".
[[bin]]
name = "sondes-solution"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
# bundled : SQLite compilé dans le binaire, comme au labo 14.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# La liste utile : #[tokio::main], le moteur multi-thread, le réseau, les
# signaux, les intervalles, et sync pour le canal watch de l'arrêt.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
toml = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
