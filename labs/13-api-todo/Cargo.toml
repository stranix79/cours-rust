[package]
name = "lab13-api-todo"
version = "0.1.0"
edition = "2024"
description = "Labo 13 du cours Rust : une API REST de tâches avec axum et tokio"
publish = false

# La bibliothèque porte le même nom dans le squelette et dans la solution :
# tests/api.rs écrit `use todo_api::...` et reste identique dans les deux.
[lib]
name = "todo_api"
path = "src/lib.rs"

[[bin]]
name = "todo-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
# Pas de default-features : on ne veut ni OpenSSL ni ses en-têtes système.
# rustls-tls fait le TLS en Rust pur, le binaire reste portable.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# La liste utile plutôt que "full" : macros pour #[tokio::main], le moteur
# multi-thread, le réseau, les signaux (Ctrl-C) et les délais.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[dev-dependencies]
# Pour les tests seulement : oneshot (tower) et la lecture des corps.
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
