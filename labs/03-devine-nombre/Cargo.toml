[package]
name = "lab03-devine-nombre"
version = "0.1.0"
edition = "2024"
description = "Labo 03 du cours Rust : le jeu du nombre à deviner"
publish = false

# La bibliothèque porte le même nom dans le squelette et dans la solution :
# les tests de tests/devine.rs écrivent `use devine::...` et restent
# identiques mot pour mot dans les deux paquets.
[lib]
name = "devine"
path = "src/lib.rs"

[[bin]]
name = "devine"
path = "src/main.rs"

[dependencies]
# La seule dépendance : la bibliothèque standard n'a pas de générateur de
# nombres aléatoires. rand::rng() et random_range viennent de rand 0.9.
rand = "0.9"
